# Para desarrollo local: levanta sólo Postgres.
#   docker compose up -d
# La app se corre aparte con `npm run dev`.
#
# En producción no se usa este archivo: Coolify construye el Dockerfile
# y le inyecta DATABASE_URL apuntando a su propio Postgres.

services:
  db:
    image: postgres:17-alpine
    container_name: split-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split
      POSTGRES_DB: split
    ports:
      - "5433:5432"
    volumes:
      - split-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  split-db-data:
