# Sólo la base, para desarrollar con `npm run dev` en la máquina.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Escucha en el 5433 porque el 5432 suele estar ocupado por un Postgres local.

services:
  db:
    image: postgres:17-alpine
    container_name: vaquita-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaquita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaquita}
      POSTGRES_DB: ${POSTGRES_DB:-vaquita}
    ports:
      - "5433:5432"
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaquita}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data-dev:
